name: PR

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# No workflow-level concurrency: it would cancel a running helm upgrade in `deploy`.
permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.unit-test
      cancel-in-progress: true

    env:
      LETTER_LOGO_URL: ${{ secrets.LETTER_LOGO_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      # Tests run in the Dockerfile_nl test image (built on the production stage), so they use the same
      # Debian libraries as production, e.g. WeasyPrint's HarfBuzz font subsetting
      - uses: Worth-NL/ci-workflows/.github/actions/docker-test@main
        with:
          image: template-preview:test
          env-names: LETTER_LOGO_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

  build:
    if: github.event.pull_request.draft == false
    needs: unit-test
    concurrency:
      group: ${{ github.workflow }}.${{ github.ref }}.build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    uses: Worth-NL/ci-workflows/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/worth-nl/notifynl-template-preview

  deploy:
    if: github.event.pull_request.draft == false && github.base_ref == 'develop'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    uses: Worth-NL/ci-workflows/.github/workflows/deploy-test.yml@main
    with:
      tag: ${{ needs.build.outputs.tag }}
      image-keys: |
        apps.templatePreviewApi
        apps.templatePreviewWorker
    secrets: inherit
