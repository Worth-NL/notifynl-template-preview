name: Merge

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/worth-nl/notifynl-template-preview

jobs:
  build-tag-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dockerfile-target: ["test"]

    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: set-tag
        run: |
          TAG=$(date +%Y%m%d).${{ github.run_number }}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.set-tag.outputs.tag }}
          target: ${{ matrix.dockerfile-target }}

      - name: Run unit tests in the test image
        env:
          LETTER_LOGO_URL: ${{ secrets.LETTER_LOGO_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: >-
          docker run --rm
          -e TZ=Europe/Amsterdam -e LETTER_LOGO_URL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY
          --entrypoint pytest ${{ env.IMAGE }}:${{ steps.set-tag.outputs.tag }}

    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}

  image-push-and-release:
    runs-on: ubuntu-latest

    needs: build-tag-test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          file: docker/Dockerfile_nl
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ needs.build-tag-test.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          target: production

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-tag-test.outputs.tag }}
          make_latest: true
          token: ${{ secrets.RELEASE_TOKEN }}
          generate_release_notes: true
